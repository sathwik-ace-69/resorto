<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resorto.com | Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="signin.css" />
</head>
<body>

  <div class="signin-wrapper">
    <div class="brand">
      <a href="index.html"><h1>Resorto.com</h1></a>
      <p>Sign in to book your perfect stay</p>
    </div>

    <h2 class="signin-title">Sign In</h2>
    <p class="signin-subtitle">Use your email to continue</p>

    <form>
      <div class="field-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          class="input-field"
          placeholder="you@example.com"
          
        />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="input-field"
          placeholder="Enter your password"
          
        />
      </div>

      <div class="helper-row">
        <label>
          <input type="checkbox" />
          <span> Remember me</span>
        </label>
        <a href="#">Forgot password?</a>
      </div>
        <button type="submit" class="signin-btn">Continue</button>
    </form>

    <p class="bottom-text">
      New to Resorto? <a href="#">Create an account</a>
